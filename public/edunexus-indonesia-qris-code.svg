<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850" style="background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Batik Kawung Pattern -->
    <pattern id="batik" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#f0f0f0" stroke-width="1.5" />
      <circle cx="0" cy="0" r="16" fill="none" stroke="#f0f0f0" stroke-width="1.5" />
      <circle cx="40" cy="0" r="16" fill="none" stroke="#f0f0f0" stroke-width="1.5" />
      <circle cx="0" cy="40" r="16" fill="none" stroke="#f0f0f0" stroke-width="1.5" />
      <circle cx="40" cy="40" r="16" fill="none" stroke="#f0f0f0" stroke-width="1.5" />
      <rect x="18" y="18" width="4" height="4" fill="#eaeaea" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="850" fill="#ffffff" />
  <rect width="600" height="850" fill="url(#batik)" />

  <!-- Left Red Geometric Polygon -->
  <polygon points="0,180 110,290 110,410 0,520" fill="#e1251b" />

  <!-- Bottom Right Red Corner Polygon -->
  <polygon points="360,850 600,610 600,850" fill="#e1251b" />

  <!-- Top Header: QRIS and GPN Logos -->
  <g transform="translate(60, 48)">
    <!-- Stylized QRIS Text/Logo -->
    <g>
      <text x="0" y="42" font-size="46" font-weight="900" fill="#000000" letter-spacing="-1.5">QRIS</text>
      <!-- Red accent square inside Q -->
      <rect x="4" y="12" width="12" height="12" fill="#e1251b" rx="2" />
      <text x="116" y="24" font-size="11" font-weight="800" fill="#000000" letter-spacing="0.2">QR Code Standar</text>
      <text x="116" y="38" font-size="11" font-weight="800" fill="#000000" letter-spacing="0.2">Pembayaran Nasional</text>
    </g>

    <!-- GPN Logo -->
    <g transform="translate(430, 0)">
      <path d="M10,2 C22,6 30,16 32,24 C24,20 18,22 14,24 C20,18 16,14 6,10 Z" fill="#c9252c" />
      <path d="M22,14 C32,20 36,28 36,32 C28,28 22,30 18,32 C24,26 22,22 14,18 Z" fill="#c9252c" />
      <text x="-4" y="55" font-size="22" font-weight="900" fill="#1c355e" letter-spacing="1.5">GPN</text>
    </g>
  </g>

  <!-- Merchant Name & Info -->
  <g transform="translate(300, 195)" text-anchor="middle">
    <text y="0" font-size="24" font-weight="900" fill="#000000" letter-spacing="0.8">EDUNEXUS INDONESIA</text>
    <text y="34" font-size="19" font-weight="700" fill="#000000" letter-spacing="1.2">NMID : ID1025429260991</text>
    <text y="76" font-size="21" font-weight="800" fill="#000000" letter-spacing="1">A01</text>
  </g>

  <!-- QR Code White Card & Matrix -->
  <g transform="translate(125, 290)">
    <rect x="-15" y="-15" width="380" height="380" fill="#ffffff" rx="8" />
    <svg x="0" y="0" width="350" height="350" viewBox="0 0 51 51">
      <path fill="#ffffff" d="M0 0h51v51H0z"/>
    </svg>
  </g>

  <!-- SATU QRIS UNTUK SEMUA -->
  <g transform="translate(300, 715)" text-anchor="middle">
    <text y="0" font-size="19" font-weight="800" fill="#222222" letter-spacing="1">SATU QRIS UNTUK SEMUA</text>
    <text y="24" font-size="14" font-weight="600" fill="#444444">Cek aplikasi penyelenggara di: <tspan font-weight="800" fill="#000000">www.aspi-qris.id</tspan></text>
  </g>

  <!-- Footer Print Metadata -->
  <g transform="translate(40, 790)" font-size="14" font-weight="700" fill="#333333">
    <text y="0">Dicetak oleh : 93600008</text>
    <text y="22">Versi Cetak : 1.0-2025.08.25</text>
  </g>

  <!-- Cara Bayar Corner (Right Bottom) -->
  <g transform="translate(440, 755)" text-anchor="center" fill="#ffffff">
    <text x="40" y="-14" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Cara bayar dengan QRIS:</text>
    <g transform="translate(0, 0)">
      <!-- Icon 1: Smartphone -->
      <g transform="translate(-30, 0)">
        <circle cx="14" cy="14" r="14" fill="#ffffff" />
        <rect x="9" y="5" width="10" height="18" rx="2" fill="#e1251b" />
        <circle cx="14" cy="20" r="1" fill="#ffffff" />
        <text x="14" y="38" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Buka Aplikasi</text>
        <text x="14" y="47" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Berlogo QRIS</text>
      </g>
      <!-- Icon 2: Scan -->
      <g transform="translate(25, 0)">
        <circle cx="14" cy="14" r="14" fill="#ffffff" />
        <path d="M8,8 L13,8 M8,8 L8,13 M20,8 L15,8 M20,8 L20,13 M8,20 L13,20 M8,20 L8,15 M20,20 L15,20 M20,20 L20,15" stroke="#e1251b" stroke-width="1.8" fill="none" />
        <text x="14" y="38" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Scan &amp; Cek</text>
      </g>
      <!-- Icon 3: Pay -->
      <g transform="translate(80, 0)">
        <circle cx="14" cy="14" r="14" fill="#ffffff" />
        <path d="M9,14 L13,18 L19,10" stroke="#e1251b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="14" y="38" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bayar</text>
      </g>
    </g>
  </g>
</svg>